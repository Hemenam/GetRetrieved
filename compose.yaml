services:
  api:
    build: .
    env_file: .env
    environment:
      HR_DATABASE_PATH: /data/hrlearnium.sqlite3
      HR_OLLAMA_BASE_URL: http://ollama:11434
      HR_MODEL_BACKEND: ollama
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - course-data:/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Add a GPU reservation appropriate for the deployment host if available.
    # This portable baseline works on CPU; production latency needs measurement.

volumes:
  course-data:
  ollama-models:

